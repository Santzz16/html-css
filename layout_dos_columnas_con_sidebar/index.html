<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Layout de dos columnas</title>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="barra-lateral">
        <img class="logo" src="img/Gemini_Generated_Image_gwp1bdgwp1bdgwp1.png" alt="FLowDash">
        <nav> 
            <ul>
                <li><a href="#inicio" class="activo">Inicio</a></li>
                <li><a href="#proyectos">Proyectos</a></li>
                <li><a href="#mensajes">Mensajes</a></li>
                <li><a href="#ajustes">Ajustes</a></li>
            </ul>
        </nav>
    </aside>
    
    <main class="contenido"> 
        <header class="encabezado">
            <img class="perfil" src="img/silueta.webp" alt="Foto de Perfil"/>
        </header>
        
        <h1>Panel Principal</h1>
        
        <section class="tarjetas">
            <article class="tarjeta"><h2>Estadisticas</h2></article>
            <article class="tarjeta"><h2>Porcentajes</h2></article>
            <article class="tarjeta"><h2>Ventas</h2></article>
        </section>
    </main>
    
</body>
</html>
